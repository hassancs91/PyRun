{% comment %}Run status badge. Expects `run` in context. A run the concurrency policy skipped or is holding gets a chip after it.{% endcomment %}
<span class="inline-flex items-center gap-1.5 px-2 py-0.5 text-xs rounded-md {% if run.status == 'success' %}bg-ok/10 text-ok{% elif run.status == 'failed' or run.status == 'timeout' %}bg-fail/10 text-fail{% elif run.status == 'running' %}bg-warn/10 text-warn{% else %}bg-panel-hi text-muted{% endif %}">
    <span class="w-1.5 h-1.5 rounded-full {% if run.status == 'success' %}bg-ok{% elif run.status == 'failed' or run.status == 'timeout' %}bg-fail{% elif run.status == 'running' %}bg-warn animate-pulse{% else %}bg-faint{% endif %}"></span>
    {{ run.get_status_display }}
</span>
{% if run.cancel_reason %}<span class="inline-flex items-center px-2 py-0.5 text-[11px] font-medium rounded-full border border-line bg-panel-hi text-muted whitespace-nowrap" title="The script's concurrency policy is Skip, and it already had a run in flight">{{ run.get_cancel_reason_display|lower }}</span>{% elif run.is_held %}<span class="inline-flex items-center px-2 py-0.5 text-[11px] font-medium rounded-full border border-info/30 bg-info/10 text-info whitespace-nowrap" title="The script's concurrency policy is Queue: this run starts when the runs ahead of it end">waiting its turn</span>{% endif %}
