{% if cell.value is None %}<span class="text-faint">—</span>{% elif cell.column.type == "boolean" %}<span class="inline-flex px-2 py-0.5 rounded-full text-xs {% if cell.value %}bg-ok/10 text-ok{% else %}bg-panel-hi text-muted{% endif %}">{{ cell.display }}</span>{% elif cell.column.type == "link" %}<a href="{{ cell.value }}" target="_blank" rel="noopener noreferrer nofollow" class="text-info hover:underline break-all">{{ cell.display }}</a>{% else %}<span class="break-words whitespace-pre-wrap">{{ cell.display }}</span>{% endif %}
